<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechStore - Modern E-Commerce</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

<!-- Navigation -->
<nav class="navbar">
    <div class="nav-container">

        <div class="nav-brand">
            <h1>TechStore</h1>
        </div>

        <!-- HAMBURGER BUTTON (NEW) -->
        <button class="hamburger" onclick="toggleMenu()">
            ☰
        </button>

        <div class="nav-menu">

            <a href="#" onclick="showHome()" class="nav-link">Shop</a>
            <a href="#" onclick="showOrders()" class="nav-link">Orders</a>

            <button class="cart-btn" onclick="toggleCart()">
                🛒 Cart <span id="cart-count" class="cart-badge">0</span>
            </button>

            <div id="auth-container" class="auth-container">
                <button class="auth-btn login-btn" onclick="showAuth('login')">Login</button>
                <button class="auth-btn register-btn" onclick="showAuth('register')">Register</button>
            </div>

            <div id="user-menu" class="user-menu" style="display: none;">
                <span id="username-display"></span>
                <button class="logout-btn" onclick="logout()">Logout</button>
            </div>

        </div>
    </div>
</nav>

<!-- Main Content -->
<div class="container">

    <!-- Auth Modal -->
    <div id="auth-modal" class="modal" style="display: none;">
        <div class="modal-content">
            <span class="close" onclick="closeAuth()">&times;</span>

            <div id="login-form" style="display: none;">
                <h2>Login</h2>
                <form onsubmit="handleLogin(event)">
                    <input type="email" placeholder="Email" required>
                    <input type="password" placeholder="Password" required>
                    <button type="submit" class="submit-btn">Login</button>
                </form>
            </div>

            <div id="register-form" style="display: none;">
                <h2>Create Account</h2>
                <form onsubmit="handleRegister(event)">
                    <input type="text" placeholder="Username" required>
                    <input type="email" placeholder="Email" required>
                    <input type="password" placeholder="Password" required>
                    <input type="password" placeholder="Confirm Password" required>
                    <button type="submit" class="submit-btn">Register</button>
                </form>
            </div>

        </div>
    </div>

    <!-- Home -->
    <section id="home-section">

        <!-- HERO SLIDER -->
<section id="home-section">

    <div class="hero-slider">

        <div class="slide active">
            <img src="https://images.unsplash.com/photo-1517336714731-489689fd1ca8" />
            <div class="caption">
                <h1>Welcome to TechStore</h1>
                <p>Latest Tech Gadgets at Best Prices</p>
            </div>
        </div>

        <div class="slide">
            <img src="https://images.unsplash.com/photo-1518770660439-4636190af475" />
            <div class="caption">
                <h1>Smart Devices</h1>
                <p>Upgrade your lifestyle with smart tech</p>
            </div>
        </div>

        <div class="slide">
            <img src="https://images.unsplash.com/photo-1526738549149-8e07eca6c147" />
            <div class="caption">
                <h1>Gaming Setup</h1>
                <p>Build your dream gaming station</p>
            </div>
        </div>

    </div>
        <div class="filters">
            <input type="text" id="search-input" placeholder="Search products..." onkeyup="filterProducts()">
            <select id="category-filter" onchange="filterProducts()">
                <option value="">All Categories</option>
                <option value="Electronics">Electronics</option>
                <option value="Accessories">Accessories</option>
            </select>
        </div>

        <div id="products-grid" class="products-grid"></div>

    </section>

</div>

<!-- CART -->
<aside id="cart-sidebar" class="cart-sidebar">
    <div class="cart-header">
        <h2>Shopping Cart</h2>
        <span class="close-cart" onclick="toggleCart()">&times;</span>
    </div>

    <div id="cart-items" class="cart-items"></div>

    <div class="cart-summary">
        <div class="summary-row">
            <span>Subtotal:</span>
            <span id="subtotal">$0.00</span>
        </div>
        <div class="summary-row">
            <span>Tax (10%):</span>
            <span id="tax">$0.00</span>
        </div>
        <div class="summary-row total">
            <span>Total:</span>
            <span id="total">$0.00</span>
        </div>

        <button class="checkout-btn" onclick="checkout()">Checkout</button>
        <button class="continue-shopping-btn" onclick="toggleCart()">Continue</button>
    </div>
</aside>

<div id="cart-overlay" class="cart-overlay" onclick="toggleCart()"></div>

<!-- TOGGLER SCRIPT -->
<script>
function toggleMenu(){
    document.querySelector(".nav-menu").classList.toggle("active");
}
</script>
<script>
let currentSlide = 0;
const slides = document.querySelectorAll(".slide");

function showSlide(index) {
    slides.forEach((slide, i) => {
        slide.classList.remove("active");
        if (i === index) {
            slide.classList.add("active");
        }
    });
}

function nextSlide() {
    currentSlide = (currentSlide + 1) % slides.length;
    showSlide(currentSlide);
}

// auto change every 3 seconds
setInterval(nextSlide, 3000);
</script>
<script src="js/app.js"></script>

</body>
</html>
